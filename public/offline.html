<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
    <title>You're offline — Syncly</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: calc(24px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        text-align: center;
      }
      .card {
        max-width: 360px;
      }
      .emoji {
        font-size: 40px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.6);
        margin: 0 0 24px;
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 999px;
        background: #fff;
        color: #000;
        font-size: 14px;
        font-weight: 600;
        padding: 12px 24px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="emoji">📡</div>
      <h1>You're offline</h1>
      <p>Syncly needs a connection to sync plans and messages. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
